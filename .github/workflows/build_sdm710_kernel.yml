name: 💫 Building RMX1901 Kernel
on:
  workflow_dispatch:
jobs:
  build:
    name: Building Kernel for RMX1901 (Realme X)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TZ: Asia/Jakarta
      USE_CCACHE: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "3G"
      CCACHE_HARDLINK: "true"
      DEVICE_CODENAME: "RMX1901"
      KERNEL_DEFCONFIG: sdm670-perf_defconfig
      ANYKERNEL_REPO: https://github.com/ij-israfil/AnyKernel3
      ANYKERNEL_BRANCH: master
      KERNEL_IMAGE: Image.gz-dtb
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: "OOMBLUES"
      KBUILD_BUILD_HOST: "RMX1901~Ubuntu-22.04.5-LTS"
      KERNEL_VERSION: "v1.0"
      KERNEL_VARIANT: "BloodMoon~Revived"
    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────
      - name: 🗂 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # ─── 2. ccache ───────────────────────────────────────────────────────
      - name: ⚡ Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "3G"
          key: build-kernel-clang-${{ env.DEVICE_CODENAME }}
      # ─── 3. Dependencies ─────────────────────────────────────────────────
      - name: ⚙️ Install Build Dependencies
        run: |
          sudo apt-get update -qq && \
          sudo apt-get install -y --no-install-recommends \
          bc bison build-essential binutils ca-certificates cpio curl \
          device-tree-compiler flex git git-lfs libssl-dev \
          make python3 python-is-python3 unzip zip xz-utils \
          libelf-dev libncurses5-dev libtinfo5 llvm lld \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      # ─── 4. Toolchain ────────────────────────────────────────────────────
      - name: 🛠️ Setting Up ZyCromerZ Clang 13.0.1
        run: |
          curl -LSs -o Clang-13.0.1.tar.gz "https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz"
          mkdir clang
          tar -xf Clang-13.0.1.tar.gz -C clang/
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH
      # ─── 5. AnyKernel3 ───────────────────────────────────────────────────
      - name: 🛠️ Clone AnyKernel3
        run: |
          git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} \
            ${{ env.ANYKERNEL_REPO }} AnyKernel3
      # ─── 6. KernelSU ─────────────────────────────────────────────────────
      - name: ⚙️ Initialize KernelSU-Next + SUSFS
        run: |
          echo ">>> Initializing KernelSU-Next + SUSFS..."
          curl -LSs "https://raw.githubusercontent.com/fakeoomblues/KernelSU-Next/refs/heads/stable/kernel/setup.sh" \
            | bash -s susfs-main
          echo ">>> Done."
      # ─── 7. Build time ───────────────────────────────────────────────────
      - name: 🕒 Get Build Time
        id: get_time
        run: echo "TIME=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
      # ─── 8. Build ────────────────────────────────────────────────────────
      - name: 💫 Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          echo ">>> Clang version: $(clang --version | head -1)"
          echo ">>> CPUs: $(nproc --all)"
          echo ">>> Building defconfig..."
          make O=out \
            ARCH=${{ env.ARCH }} \
            ${{ env.KERNEL_DEFCONFIG }}
          echo ">>> Compiling..."
          make O=out -j$(nproc --all) \
            ARCH=${{ env.ARCH }} \
            SUBARCH=${{ env.SUBARCH }} \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KBUILD_BUILD_USER=${{ env.KBUILD_BUILD_USER }} \
            KBUILD_BUILD_HOST=${{ env.KBUILD_BUILD_HOST }} \
            KCFLAGS="-w -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=unused-command-line-argument -Wno-error=address-of-packed-member" \
            2>&1 | tee build.log
          if [ ! -f out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE }} ]; then
            echo "❌ Build Failed! Image not found."
            exit 1
          fi
          echo "✅ Build Successful!"
      # ─── 9. Package ──────────────────────────────────────────────────────
      - name: 📦 Package Kernel
        run: |
          cp out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE }} AnyKernel3/
          ZIP_NAME="BloodMoon-Revived${{ env.KERNEL_VERSION }}-${{ env.KERNEL_VARIANT }}-KSUN-SUSFS-2.0.0-${{ env.DEVICE_CODENAME }}-${{ steps.get_time.outputs.TIME }}.zip"
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" ./* -x "*.git*" -x "README.md"
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
      # ─── 10. Release ─────────────────────────────────────────────────────
      - name: 🚀 Release
        uses: actions/upload-artifact@v4.6.0
        with:
          name: BloodMoon-Revived${{ env.KERNEL_VERSION }}-${{ env.KERNEL_VARIANT }}-${{ env.DEVICE_CODENAME }}-${{ steps.get_time.outputs.TIME }}
          path: ${{ env.ZIP_NAME }}